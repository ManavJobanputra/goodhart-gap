[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodhart-gap"
version = "0.1.0"
description = "Measuring apparent vs genuine competence in code-repair agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "goodhart-gap contributors" }]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "evalplus>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
gg = "goodhart_gap.cli:app"

[tool.uv]
exclude-newer = "2026-11-12T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_gap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM102"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "data: requires dataset download / build",
    "live: requires network and real model calls (GG_LIVE=1)",
]
timeout = 120
